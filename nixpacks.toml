[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo_pgsql", "php82Extensions.pgsql"]

[phases.install]
cmds = ["composer install --no-interaction --optimize-autoloader --no-dev"]

[phases.build]
cmds = ["php artisan key:generate --force"]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"