services:
  - type: web
    name: kwdc-web
    runtime: docker
    plan: free
    repo: https://github.com/kirannetpack-ui/kwdc
    branch: production-readiness-reminders-notifications
    dockerfilePath: ./dockerfile
    dockerContext: .
    dockerCommand: bash scripts/deploy/start-production.sh
    healthCheckPath: /ping
    autoDeployTrigger: commit
    envVars:
      - key: APP_NAME
        value: KTM Warehouse & Distribution Center
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: PHASE_ONE_DEMO
        value: "false"
      - key: SEED_PORTAL_ACCOUNTS
        value: "true"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: kwdc-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_HTTP_ONLY
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: KTM-WDC
      - key: KHALTI_PUBLIC_KEY
        sync: false
      - key: KHALTI_SECRET_KEY
        sync: false
      - key: KHALTI_BASE_URL
        value: https://a.khalti.com/api/v2/
      - key: KHALTI_VERIFICATION_URL
        value: https://a.khalti.com/api/v2/epayment/lookup/
      - key: ESEWA_MERCHANT_CODE
        sync: false
      - key: ESEWA_SECRET_KEY
        sync: false
      - key: ESEWA_PAYMENT_URL
        value: https://esewa.com.np/epay/main
      - key: ESEWA_VERIFICATION_URL
        value: https://esewa.com.np/epay/transrec

databases:
  - name: kwdc-db
    plan: free
    databaseName: kwdc
    user: kwdc_user
